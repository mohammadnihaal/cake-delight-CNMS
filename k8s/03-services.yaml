# notification-service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: cakedelight
spec:
  replicas: 1
  selector:
    matchLabels: { app: notification-service }
  template:
    metadata:
      labels: { app: notification-service }
    spec:
      containers:
        - name: notification-service
          image: cakedelight/notification-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3004
          envFrom:
            - configMapRef: { name: cakedelight-config }
            - secretRef: { name: cakedelight-secret }
            # Real SMTP settings from notification-service/.env (see README). Overrides the
            # Mailpit defaults in the ConfigMap; optional so the app still starts without it.
            - secretRef: { name: mail-secret, optional: true }
          readinessProbe:
            httpGet: { path: /health, port: 3004 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 3004 }
            initialDelaySeconds: 90
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 300m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: cakedelight
spec:
  selector: { app: notification-service }
  ports:
    - port: 3004
---
# gateway
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: cakedelight
spec:
  replicas: 1
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      containers:
        - name: gateway
          image: cakedelight/gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: { name: cakedelight-config }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 90
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 300m, memory: 192Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: cakedelight
spec:
  selector: { app: gateway }
  ports:
    - port: 8080
---
# frontend (nginx serving the React build, proxying /api to the gateway)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: cakedelight
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: cakedelight/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: cakedelight
spec:
  type: NodePort
  selector: { app: frontend }
  ports:
    - port: 80
      nodePort: 30080
