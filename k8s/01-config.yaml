apiVersion: v1
kind: ConfigMap
metadata:
  name: cakedelight-config
  namespace: cakedelight
data:
  MONGO_URI: mongodb://mongo:27017/cakedelight
  CATALOG_URL: http://catalog-service:3001
  ORDER_URL: http://order-service:3002
  RATING_URL: http://rating-service:3003
  NOTIFICATION_URL: http://notification-service:3004
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
---
apiVersion: v1
kind: Secret
metadata:
  name: cakedelight-secret
  namespace: cakedelight
type: Opaque
stringData:
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
